name: cgsi-corporate

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PAYLOAD_CMS_URL: http://cms:3001
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      cms:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  cms:
    build:
      context: ./cms
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://${POSTGRES_USER:-cgsi}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-cgsi_payload}"
      PAYLOAD_SECRET: "${PAYLOAD_SECRET:?Set PAYLOAD_SECRET in .env}"
      NEXT_PUBLIC_SERVER_URL: "${CMS_PUBLIC_URL:-http://localhost:3001}"
    ports:
      - "${CMS_PORT:-3001}:3001"
    volumes:
      - cms_media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/globals/site-settings').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-cgsi_payload}"
      POSTGRES_USER: "${POSTGRES_USER:-cgsi}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cgsi} -d ${POSTGRES_DB:-cgsi_payload}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  cms_media:
  postgres_data:
